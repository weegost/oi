# 資料夾名稱是中文，需明確指定專案名稱
name: bizpilot

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: bizpilot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bizpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bizpilot}
      POSTGRES_DB: ${POSTGRES_DB:-bizpilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
